id = "linear-tui"
name = "Linear TUI"
version = "0.0.1"
min_herdr_version = "0.9.0"
description = "Linear in a herdr split or popup: issues, details with images, comments, status and assignee edits, all through linearctl. Every write is a dry run first and shows the exact command. Try it with no account: the demo action."
platforms = ["macos", "linux"]

# Needs Rust 1.90+. linearctl (https://github.com/solcreek/linear-cli) holds
# the API key: run `linearctl auth login --yes` once before `open`.
[[build]]
command = ["sh", "scripts/herdr-build.sh"]

# Bind them in ~/.config/herdr/config.toml:
#   [[keys.command]]
#   key = "prefix+alt+l"
#   type = "plugin_action"
#   command = "linear-tui.open"
[[actions]]
id = "open"
title = "Linear: open in a split"
contexts = ["workspace", "pane"]
command = ["sh", "scripts/herdr-open.sh", "linear"]

# Popups float over the work but show no images: herdr does not pass
# terminal graphics through a popup.
[[actions]]
id = "popup"
title = "Linear: open in a popup"
contexts = ["global", "workspace", "pane"]
command = ["sh", "scripts/herdr-open.sh", "linear-popup"]

[[actions]]
id = "demo"
title = "Linear: demo (fictional workspace)"
contexts = ["workspace", "pane"]
command = ["sh", "scripts/herdr-open.sh", "demo"]

[[panes]]
id = "linear"
title = "Linear"
placement = "split"
command = ["sh", "scripts/herdr-pane.sh"]

[[panes]]
id = "linear-popup"
title = "Linear"
placement = "popup"
width = "90%"
height = "85%"
command = ["sh", "scripts/herdr-pane.sh"]

[[panes]]
id = "demo"
title = "Linear (demo)"
placement = "split"
command = ["sh", "scripts/herdr-pane.sh", "--demo"]

# The demo as a popup, for scripts/herdr-screenshots.sh.
[[panes]]
id = "demo-popup"
title = "Linear (demo)"
placement = "popup"
width = "90%"
height = "85%"
command = ["sh", "scripts/herdr-pane.sh", "--demo"]
