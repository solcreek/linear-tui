[package]
name = "linear-tui"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for Linear that gets all its data from linearctl"
license = "MIT"
repository = "https://github.com/solcreek/linear-tui"
keywords = ["linear", "tui", "ratatui", "terminal", "issue-tracker"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde_json = "1"
shlex = "2"
