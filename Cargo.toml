[package]
name = "linear-tui"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
default-run = "linear-tui"
description = "A terminal UI for Linear that gets all its data from linearctl"
license = "MIT"
repository = "https://github.com/solcreek/linear-tui"
keywords = ["linear", "tui", "ratatui", "terminal", "issue-tracker"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "display", "std"] }
unicode-width = "0.2"
ureq = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# examples/pty-record.rs: a PTY for scripts/herdr-screenshots.sh.
libc = "0.2"
