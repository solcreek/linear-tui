[package]
name = "linear-tui"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for Linear that gets all its data from linearctl"
license = "MIT"
repository = "https://github.com/solcreek/linear-tui"
keywords = ["linear", "tui", "ratatui", "terminal", "issue-tracker"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
crossterm = { version = "0.29", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
shlex = "2"
unicode-width = "0.2"
